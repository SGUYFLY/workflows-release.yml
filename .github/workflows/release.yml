# สร้างตัวติดตั้ง Windows อัตโนมัติ เมื่อสร้าง tag เช่น v1.0.0  แล้วแนบไฟล์ใน GitHub Releases
#   git tag v1.0.0 && git push origin v1.0.0
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: build web
        working-directory: frontend
        env: { VITE_API_URL: "" }
        run: |
          npm ci
          npm run build
      - name: build desktop
        working-directory: desktop
        run: |
          npm install
          npm run dist
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            desktop/release/ThaiStructure-Setup-*.exe
            desktop/release/ThaiStructure-Portable-*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: desktop/release/*.exe
